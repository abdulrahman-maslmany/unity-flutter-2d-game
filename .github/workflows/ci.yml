name: Flutter & Unity Quality CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  flutter-checks:
    name: Flutter Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd my_app
          flutter pub get

      - name: Dependency Outdated & Security Audit
        run: |
          cd my_app
          flutter pub outdated

      # ✅ تطبيق التوصية 07: إجبار الـ CI على الفشل إذا وُجد أي Warning أو Info
      - name: Strict Flutter Static Analysis & Lint
        run: |
          cd my_app
          flutter analyze --fatal-infos --fatal-warnings

      - name: Run Flutter Unit Tests with Coverage
        run: |
          cd my_app
          flutter test --coverage

  csharp-checks:
    name: C# Build, Roslyn Analyzer & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore C# Dependencies
        run: dotnet restore Assets/Tests/GameTests.csproj

      # ✅ تطبيق التوصية 07: خطوة مستقلة لفحص Roslyn الصارم ومعاملة التحذيرات كأخطاء
      - name: Roslyn Analyzer Check & Strict Typecheck
        run: dotnet build Assets/Tests/GameTests.csproj --no-restore /p:TreatWarningsAsErrors=true

      # ✅ جمع تقرير التغطية Code Coverage لـ C#
      - name: Run C# Automated Unit Tests with Coverage
        run: >
          dotnet test Assets/Tests/GameTests.csproj
          --no-build
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
