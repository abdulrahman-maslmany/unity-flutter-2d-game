name: Flutter & Unity Quality CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ✅ فرض مبدأ الصلاحيات الأدنى (Least Privilege) لضمان الأمان
permissions:
  contents: read

jobs:
  flutter-checks:
    name: Flutter Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ✅ تثبيت الـ Commit SHA لمنع تحذيرات Codacy الأمنية
      - name: Setup Flutter Environment
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd my_app
          flutter pub get

      - name: Dependency Outdated & Hygiene Check
        run: |
          cd my_app
          flutter pub outdated

      - name: Strict Flutter Static Analysis & Lint
        run: |
          cd my_app
          flutter analyze --fatal-infos --fatal-warnings

      - name: Run Flutter Unit Tests with Coverage
        run: |
          cd my_app
          flutter test --coverage

  csharp-checks:
    name: C# Build, Roslyn Analyzer & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ✅ استعادة الحزم عبر الوضع المقفل لضمان بنية مستقرة وقابلة للتكرار 100%
      - name: Restore C# Dependencies (Locked Mode)
        run: dotnet restore Assets/Tests/GameTests.csproj --locked-mode

      - name: Roslyn Analyzer Check & Strict Typecheck
        run: dotnet build Assets/Tests/GameTests.csproj --no-restore /p:TreatWarningsAsErrors=true

      - name: Run C# Automated Unit Tests with Coverage
        run: >
          dotnet test Assets/Tests/GameTests.csproj
          --no-build
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
