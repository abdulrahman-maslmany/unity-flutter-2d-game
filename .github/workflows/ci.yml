name: Flutter & Unity Quality CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  flutter-checks:
    name: Flutter Lint, Audit & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd my_app
          flutter pub get

      - name: Dependency Outdated & Security Audit
        run: |
          cd my_app
          flutter pub outdated

      - name: Analyze Flutter Code
        run: |
          cd my_app
          flutter analyze

      - name: Run Flutter Unit Tests with Coverage
        run: |
          cd my_app
          flutter test --coverage

  csharp-checks:
    name: C# Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore C# Dependencies
        run: dotnet restore Assets/Tests/GameTests.csproj

      - name: Build C# Test Assembly
        run: dotnet build Assets/Tests/GameTests.csproj --no-restore

      - name: Run C# Automated Unit Tests
        run: dotnet test Assets/Tests/GameTests.csproj --no-build --logger "console;verbosity=normal"
