version: 2
updates:
  # 1. مراقبة حزم Flutter و Dart
  - package-ecosystem: "pub"
    directory: "/my_app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # 2. مراقبة حزم C# و NuGet الخاصة باختبارات Unity
  - package-ecosystem: "nuget"
    directory: "/Assets/Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
